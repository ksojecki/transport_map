services:
  - type: web
    name: mapa-transportu
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm run setup && corepack pnpm run build
    startCommand: corepack pnpm start
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
